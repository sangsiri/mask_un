<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-start:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        #webcam-container {
            margin: 1.5rem auto;
            border-radius: 12px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #label-container {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .prediction-bar-bg {
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }

        .prediction-bar-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Teachable Machine Image Model</h1>
    <button type="button" class="btn-start" onclick="init()">เปิดกล้องและเริ่มทำงาน</button>
    <div id="webcam-container">
        <span style="color: #64748b; font-size: 0.9rem;">กล้องยังไม่ได้เปิด</span>
    </div>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/onx3F52cv/";
    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        // ซ่อนปุ่มหลังจากกดเพื่อป้องกันการกดซ้ำ
        document.querySelector('.btn-start').style.display = 'none';
        document.getElementById("webcam-container").innerHTML = "";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // ปรับขนาดกล้องให้ใหญ่ขึ้นเล็กน้อย (250x250) เพื่อความสวยงาม
        const flip = true; 
        webcam = new tmImage.Webcam(250, 250, flip); 
        await webcam.setup(); 
        await webcam.play();

        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        
        // สร้างโครงสร้างการแสดงผลแบบมีแถบความมั่นใจ (Progress Bar)
        for (let i = 0; i < maxPredictions; i++) {
            const row = document.createElement("div");
            row.className = "label-row";
            row.innerHTML = `
                <div style="flex: 1; text-align: left;">
                    <span class="class-name">กำลังโหลด...</span>
                    <div class="prediction-bar-bg">
                        <div class="prediction-bar-fill" id="bar-${i}"></div>
                    </div>
                </div>
                <span class="class-prob" id="prob-${i}" style="margin-left: 10px; font-variant-numeric: tabular-nums;">0.00</span>
            `;
            labelContainer.appendChild(row);
        }

        // เรียกทำงานครั้งแรกทันที
        updateData();

        // ตั้งเวลาให้ทำงานทุกๆ 3 วินาที (3000 มิลลิวินาที)
        setInterval(updateData, 3000);
    }

    // ฟังก์ชันอัปเดตเฟรมภาพและทำนายผล
    async function updateData() {
        if (webcam) {
            webcam.update(); // อัปเดตภาพจากกล้อง
            await predict(); // ประมวลผลและแสดงผลลัพธ์
        }
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const probability = prediction[i].probability;
            
            // อัปเดตชื่อและเปอร์เซ็นต์ตัวเลข
            labelContainer.childNodes[i].querySelector('.class-name').innerText = className;
            labelContainer.childNodes[i].querySelector(`#prob-${i}`).innerText = probability.toFixed(2);
            
            // อัปเดตแถบความยาวสีตามค่าความมั่นใจ
            const barFill = labelContainer.childNodes[i].querySelector(`#bar-${i}`);
            barFill.style.width = (probability * 100) + "%";
        }
    }
</script>

</body>
</html>
